# 订阅独立的 Quantumult X 配置 · 2026-11-08
# 新安装才需「下载配置」；已有配置只添加 rules/Custom.list 远程分流，见 README。
# 使用「分流」模式，并关闭「其他设置 → 分流匹配优化」，以保持规则顺序。
# 地区按节点名识别；纯编号节点保留在「全球自动」和「手动节点」。
# AI 是 Siri / Apple Intelligence 专用出口；新配置默认美国，首次使用核对原有效出口。
# 维护与使用：https://github.com/omoyx/quantumult-x

[general]
